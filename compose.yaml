
services:
  mongo-server:
    image: mongo:8
    container_name: cc-java-mongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cc-java-mongo-data:/data/db

  mongo-express:
    image: mongo-express:1
    container_name: cc-java-mongo-gui
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-server
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo-server

volumes:
  cc-java-mongo-data:
