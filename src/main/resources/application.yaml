spring:
  application:
    name: cc_java_mongo

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/medicaldb}
      auto-index-creation: true

server:
  port: 8081

logging:
  level:
    root: INFO
    fr.dawan.cc_java_mongo: DEBUG
    org.springframework.data.mongodb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Medical API
    description: API REST de gestion médicale


app:
  jwt:
    # Aucune clé par défaut : JWT_SECRET doit être défini hors du dépôt.
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
  security:
    bootstrap-user:
      enabled: ${BOOTSTRAP_USER_ENABLED:false}
      # Le mot de passe doit être fourni par variable d'environnement en production
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:}
